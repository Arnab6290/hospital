<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hospital Appointments</title><link rel="stylesheet" href="style.css">
<style>
body{font-family:Arial,sans-serif;background:#f3f6fa;color:#172033;margin:0}.app-shell{min-height:100vh}.header{background:#087f8c;color:white;padding:22px 26px}.header h1{margin:0 0 6px}.nav{display:flex;flex-wrap:wrap;gap:8px;background:white;padding:12px 20px;box-shadow:0 2px 5px #0001}.nav button{border:0;border-radius:7px;padding:10px 14px;background:#e7f3f5;cursor:pointer;font-weight:600}.nav button.active,.primary{background:#078391!important;color:white!important}.main{max-width:1100px;margin:22px auto;padding:0 16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.card{background:white;border-radius:10px;padding:17px;box-shadow:0 2px 9px #0001}.card h3{margin:0 0 10px;color:#607080;font-size:14px}.big{font-size:27px;font-weight:bold}.table-wrap{overflow-x:auto;background:white;border-radius:10px;margin-top:15px}table{border-collapse:collapse;width:100%;min-width:600px}th,td{padding:12px;text-align:left;border-bottom:1px solid #e6ebf0}th{background:#f5f8fb}.form{background:white;padding:18px;border-radius:10px;display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.form label{display:flex;flex-direction:column;gap:5px}.form input,.form select{padding:9px;border:1px solid #cbd5df;border-radius:6px;min-width:150px}.pill{border-radius:20px;padding:4px 9px;background:#e9f5ed;font-size:12px}.action{padding:6px 9px;border:0;border-radius:5px;cursor:pointer;margin-right:4px}.muted{color:#64748b}.error{color:#b42318;background:#fee;padding:12px;border-radius:8px}.note{margin-top:16px;color:#64748b;font-size:13px}@media(max-width:600px){.header{padding:18px}.main{padding:0 10px}}
</style></head><body>
<div id="root"><div class="header"><h1>Hospital Appointments</h1><div>Loading system…</div></div></div>
<script src="db.js"></script><script src="app.js"></script>
</body></html>
